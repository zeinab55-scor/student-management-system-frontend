<div class="login-page">
  <div class="login-card">
    <div class="login-illustration">
      <img src="Mobile login-bro.png" alt="Login illustration">
      <h2>Welcome Back!</h2>
      <p>Continue your learning journey and achieve your goals.</p>
    </div>

    <div class="login-form-section">
      <div class="form-wrapper">
        <div class="form-header">
          <div class="logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
          <h1>Welcome Back</h1>
          <p>Login to continue learning with EduSphere</p>
        </div>

        <form>
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper"><i class="bi bi-envelope"></i><input id="email" type="email" placeholder="Enter your email"></div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper"><i class="bi bi-lock"></i><input id="password" type="password" placeholder="Enter your password"></div>
          </div>

          <div class="form-options">
            <label class="remember-me"><input type="checkbox"> <span>Remember me</span></label>
            <a href="#">Forgot Password?</a>
          </div>

          <button type="submit" class="login-btn">Login</button>
        </form>

        <p class="register-text">Don't have an account? <a routerLink="/register">Register</a></p>
      </div>
    </div>
  </div>
</div>
